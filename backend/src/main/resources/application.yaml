spring:
  application:
    name: nexapay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/nexapay}
    username: ${DB_APP_USER:nexapay_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    user: ${DB_OWNER_USER:nexapay_owner}
    password: ${DB_OWNER_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
