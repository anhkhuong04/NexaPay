name: P0 wallet and funding
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run test
          npm run build
          npm audit --audit-level=moderate
      - name: PostgreSQL integration and packaged backend
        working-directory: backend
        run: ./mvnw -B -ntp -Pweb verify
      - name: Start same-origin application
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose.yaml up -d --wait db
          node infra/runtime-smoke.mjs
          set -a
          source .env
          set +a
          java -jar backend/target/nexapay-0.1.0-SNAPSHOT.jar --spring.profiles.active=local > app.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health; then exit 0; fi
            sleep 1
          done
          cat app.log
          exit 1
      - name: Connected desktop/mobile acceptance
        working-directory: frontend
        run: |
          node ./node_modules/@playwright/test/cli.js install --with-deps chromium
          npm run test:e2e
      - name: Funding reconciliation snapshot
        run: docker compose --env-file .env -f infra/compose.yaml exec -T db psql -U nexapay_app -d nexapay < infra/reconcile.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            backend/target/surefire-reports/
            frontend/playwright-report/
            frontend/test-results/
            app.log
            .tools/runtime-smoke.log
